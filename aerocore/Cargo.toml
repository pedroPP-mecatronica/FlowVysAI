[workspace]
resolver = "2"
members = [
    "crates/aerocore_core",
    "crates/aerocore_ffi",
    "crates/aerocore_ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["AeroCore Team"]

[workspace.dependencies]
# Memory
bumpalo = "3.16"
slab = "0.4"

# Math / Numerics
num-traits = "0.2"
nalgebra = "0.33"
approx = "0.5"

# Parallelism
rayon = "1.10"
crossbeam = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
